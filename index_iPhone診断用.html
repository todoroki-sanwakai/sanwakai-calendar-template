
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>等々力三和会 予定連絡テンプレート</title>

  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px 40px;
      background: #f2f6fa;
      color: #203047;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      font-size: 25px;
      line-height: 1.4;
      margin: 8px 0 12px;
    }
    .intro {
      margin-bottom: 24px;
    }
    section {
      background: white;
      padding: 20px;
      margin-bottom: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 9px #00000012;
    }
    h2 {
      font-size: 22px;
      margin: 0 0 12px;
      color: #17436d;
    }
    .date-label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input[type="date"] {
      width: 100%;
      min-height: 52px;
      padding: 8px 12px;
      font: inherit;
      color: inherit;
      border: 1px solid #9aafc5;
      border-radius: 9px;
      background: white;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: inherit;
      font-size: 18px;
      line-height: 1.8;
      padding: 16px;
      background: #f5f7fa;
      border: 1px solid #dbe3ed;
      border-radius: 9px;
    }
    button {
      display: block;
      width: 100%;
      min-height: 58px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #1766b1;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #e38a00;
      outline-offset: 3px;
    }
    .status {
      min-height: 28px;
      font-size: 16px;
      margin: 8px 0 0;
    }
    footer {
      font-size: 15px;
      color: #526174;
      text-align: center;
    }
  
    .date-button {
    display: block;
    width: 100%;
    min-height: 58px;
    margin-top: 8px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #1766b1;
    color: white;
    font: inherit;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    }
    
    .date-input-container {
      position: relative;
      width: 100%;
      height: 58px;
      margin-top: 8px;
      border-radius: 10px;
      background: #1766b1;
      overflow: hidden;
    }

    .date-input-label {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font: inherit;
      font-weight: bold;
      pointer-events: none;
    }

    .date-input-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    .date-input-overlay::-webkit-calendar-picker-indicator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      cursor: pointer;
    }


</style>
</head>
<body>
<main>
  <h1>等々力三和会<br>予定連絡テンプレート</h1>
  <p class="intro">
    日付を選択し、LINEに貼り付けてから他の項目を入力してください。
  </p>

 
<section>
  <h2>予定登録</h2>

    <label class="date-label" for="registerDate">予定の日付</label>
    
    <button type="button" class="date-button"
            onclick="openDatePicker('register')">
      📅 日付を選択する
    </button>

    <div class="date-picker-wrap" id="registerDateWrap" hidden>
      <input type="date" id="registerDate"
            onchange="dateSelected('register')"
            oninput="dateSelected('register')">
    </div>

  <p class="selected-date" id="registerSelectedDate">
    選択した日付：未選択
  </p>


    <pre id="register">【予定登録】
日付：YYYY/MM/DD
予定：
開始：
終了：
場所：
備考：</pre>
    <button type="button"
      onclick="copyTemplate('register', 'registerStatus')">
      予定登録をコピー
    </button>
    <p class="status" id="registerStatus"
       role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>予定中止</h2>
    
      <label class="date-label" for="cancelDate">予定の日付</label>
      
        <button type="button" class="date-button"
                onclick="openDatePicker('cancel')">
          📅 日付を選択する
        </button>

        <div class="date-picker-wrap" id="cancelDateWrap" hidden>
          <input type="date" id="cancelDate"
                onchange="dateSelected('cancel')"
                oninput="dateSelected('cancel')">
        </div>

      <p class="selected-date" id="cancelSelectedDate">
        選択した日付：未選択
      </p>

    <pre id="cancel">【予定中止】
日付：YYYY/MM/DD
予定：
理由：</pre>
    <button type="button"
      onclick="copyTemplate('cancel', 'cancelStatus')">
      予定中止をコピー
    </button>
    <p class="status" id="cancelStatus"
       role="status" aria-live="polite"></p>
  </section>

  <footer>
    コピー後、このページを閉じてLINEに戻り、
    貼り付け・編集して送信してください。
  </footer>
</main>

<script>



function openDatePicker(templateId) {
  const input = document.getElementById(templateId + 'Date');
  const wrap = document.getElementById(templateId + 'DateWrap');

  if (!input || !wrap) {
    alert('診断：日付入力欄が見つかりません');
    return;
  }

  wrap.hidden = false;

  const supported = typeof input.showPicker === 'function';

  if (!supported) {
    alert('診断：showPicker は利用できません');
    input.focus();
    return;
  }

  try {
    input.showPicker();
    alert('診断：showPicker の呼び出しは成功しました');
  } catch (error) {
    alert(
      '診断：showPicker でエラーが発生\n' +
      '種類：' + error.name + '\n' +
      '内容：' + error.message
    );
    input.focus();
  }
}



function dateSelected(templateId) {
  updateTemplate(templateId);

  const input = document.getElementById(templateId + 'Date');
  const formatted = formatDateWithWeekday(input.value);
  const display = document.getElementById(
    templateId + 'SelectedDate'
  );

  display.textContent =
    '選択した日付：' + (formatted || '未選択');
}

function formatDateWithWeekday(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!match) return null;

  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);

  const date = new Date(0);
  date.setFullYear(year, month - 1, day);
  date.setHours(12, 0, 0, 0);

  if (
    date.getFullYear() !== year ||
    date.getMonth() !== month - 1 ||
    date.getDate() !== day
  ) {
    return null;
  }

  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  const weekday = weekdays[date.getDay()];

  return `${match[1]}/${match[2]}/${match[3]}（${weekday}）`;
}

function updateTemplate(templateId) {
  const input = document.getElementById(templateId + 'Date');
  const output = document.getElementById(templateId);
  const formatted = formatDateWithWeekday(input.value);

  const dateText = formatted || 'YYYY/MM/DD';

  if (templateId === 'register') {
    output.textContent =
`【予定登録】
日付：${dateText}
予定：
開始：
終了：
場所：
備考：`;
  } else {
    output.textContent =
`【予定中止】
日付：${dateText}
予定：
理由：`;
  }

  document.getElementById(templateId + 'Status').textContent = '';
}

async function copyTemplate(templateId, statusId) {
  const input = document.getElementById(templateId + 'Date');
  const status = document.getElementById(statusId);

  if (!formatDateWithWeekday(input.value)) {
    status.textContent = '先に正しい日付を入力してください。';
    input.focus();
    return;
  }

  const text = document.getElementById(templateId).textContent;

  try {
    await navigator.clipboard.writeText(text.trim());
    status.textContent = 'コピーしました。LINEに貼り付けてください。';
  } catch (error) {
    status.textContent =
      'コピーできませんでした。テンプレートの文字を選択してコピーしてください。';
  }
}
</script>
</body>
</html>
